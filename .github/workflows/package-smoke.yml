name: Package smoke

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    name: Python 3.11 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package
        run: python -m pip install .
      - name: Verify installed API
        run: >-
          python -c "import inspect, cristma;
          from importlib.metadata import version;
          from cristma.diffraction import PowderProfileCalculator;
          assert cristma.__version__ == version('cristma');
          assert 'd_spacing_scale' in inspect.signature(PowderProfileCalculator.calculate).parameters;
          print(cristma.__version__)"

  archives:
    name: Build and audit distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Build distributions
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
      - name: Reject excluded content
        run: >-
          python -c "import pathlib, tarfile, zipfile;
          archives=list(pathlib.Path('dist').iterdir());
          names=[name for path in archives for name in
          (zipfile.ZipFile(path).namelist() if path.suffix == '.whl' else
          tarfile.open(path, 'r:gz').getnames())];
          forbidden=[name for name in names if '/tests/' in '/' + name or
          '/docs/' in '/' + name or name.endswith('/cristma.zip')];
          assert not forbidden, forbidden;
          print('archive content clean')"
