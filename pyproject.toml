[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "cristma"
version = "0.1.0b6"
description = "Physics-first crystallography, crystal chemistry, and periodic structure analysis"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.26",
]

[project.urls]
Repository = "https://github.com/ABKuznetsov/CrIStMa"
Issues = "https://github.com/ABKuznetsov/CrIStMa/issues"

[project.optional-dependencies]
reference-build = [
    "spglib==2.7.0",
    "xraylib==4.3.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cristma = [
    "reference_data/resources/*.json",
    "reference_data/resources/*.md",
    "reference_data/resources/*.txt",
    "reference_data/resources/crystallography/*.json",
    "reference_data/resources/crystallography/*.md",
    "reference_data/resources/crystallography/*.txt",
    "reference_data/resources/xray/*.json",
    "reference_data/resources/xray/*.md",
    "reference_data/resources/xray/*.txt",
]
